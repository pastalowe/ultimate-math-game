<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Rush Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Orbitron',sans-serif;color:white;}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}
#infernoCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;}
#fxCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}

.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s ease;padding:16px;}
.screen.active{opacity:1;pointer-events:all;}

/* START */
.game-title{font-size:clamp(38px,9vw,74px);font-weight:900;background:linear-gradient(90deg,#fff,#00ffff,#ff00ff,#fff);-webkit-background-clip:text;color:transparent;background-size:200%;animation:shimmer 3s linear infinite;margin-bottom:2px;}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.game-sub{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.35);margin-bottom:24px;}
.menu-card{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px 28px;width:min(390px,92vw);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:9px;}
.hi-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:12px;margin-bottom:2px;}
.hi-val{color:#ffee00;font-weight:700;font-size:14px;}
.mbtn{width:100%;padding:14px 18px;border:none;border-radius:13px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:space-between;}
.mbtn:hover{transform:translateX(5px) scale(1.02);}
.mbtn-easy{background:linear-gradient(135deg,#00cc66,#00ff99);color:#002a18;}
.mbtn-normal{background:linear-gradient(135deg,#cc9900,#ffdd00);color:#2a1e00;}
.mbtn-hard{background:linear-gradient(135deg,#bb0033,#ff3366);color:white;}
.mbtn-mega{background:linear-gradient(135deg,#3300bb,#bb00ff);color:white;}
.mbtn-tag{font-size:10px;opacity:.65;font-weight:400;}
#megaWrap{display:none;}

/* PLAY */
#s-play{justify-content:flex-start;padding:0;}
.play-inner{width:min(440px,98vw);padding:18px 18px 14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.13);border-radius:0 0 26px 26px;backdrop-filter:blur(20px);}
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.hud-box{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 12px;}
.hud-num{font-size:24px;font-weight:900;transition:color .3s;}
.mode-pill{font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);}
.time-track{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-bottom:12px;overflow:hidden;}
.time-fill{height:100%;border-radius:3px;transition:width .85s linear,background .5s;}
.q-wrap{text-align:center;margin:8px 0 12px;min-height:64px;display:flex;align-items:center;justify-content:center;}
.q-text{font-size:clamp(34px,8vw,52px);font-weight:900;transition:text-shadow .4s;}
.choices-grid{display:grid;gap:8px;margin-bottom:12px;}
.choice-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:white;padding:13px 8px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:.13s;position:relative;overflow:hidden;}
.choice-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.03);}
.choice-btn.correct{background:linear-gradient(135deg,#00cc55,#00ff88)!important;border-color:#00ff88!important;transform:scale(1.05)!important;}
.choice-btn.wrong{background:linear-gradient(135deg,#bb0022,#ff0044)!important;border-color:#ff0044!important;}
.combo-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border-radius:11px;padding:9px 13px;margin-bottom:9px;}
.combo-left{display:flex;flex-direction:column;gap:1px;}
.combo-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:2px;}
.combo-num{font-size:26px;font-weight:900;transition:all .2s;line-height:1;}
.combo-bar-wrap{flex:1;margin:0 11px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.combo-bar-inner{height:100%;border-radius:2px;transition:width .3s,background .3s;}
.streak-txt{font-size:10px;font-weight:700;letter-spacing:1px;min-width:90px;text-align:right;}
.stats-row{display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.28);padding:0 2px;}

/* END */
.end-card{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:26px 26px 22px;width:min(390px,92vw);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.end-title{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:3px;}
.rank-big{font-size:68px;font-weight:900;line-height:1;animation:rankPulse 1.2s ease-in-out infinite alternate;}
@keyframes rankPulse{0%{text-shadow:0 0 20px currentColor,0 0 40px currentColor;}100%{text-shadow:0 0 60px currentColor,0 0 110px currentColor;}}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;}
.end-stat{background:rgba(255,255,255,.07);border-radius:11px;padding:11px;display:flex;flex-direction:column;gap:3px;}
.end-stat-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:1px;}
.end-stat-val{font-size:20px;font-weight:700;}
.newhi{color:#ffee00;font-size:12px;font-weight:700;letter-spacing:1px;min-height:16px;}
.end-mode-badge{font-size:10px;font-weight:700;padding:3px 12px;border-radius:20px;letter-spacing:1px;}
.end-btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;background:linear-gradient(135deg,#3300bb,#bb00ff);color:white;}
.end-btn:hover{transform:scale(1.03);}

/* FX DOM elements */
.float-txt{position:fixed;font-weight:900;pointer-events:none;z-index:200;animation:floatUp .95s ease-out forwards;font-family:'Orbitron',sans-serif;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-90px) scale(.5);}}
.flame-el{position:fixed;pointer-events:none;z-index:50;animation:flameUp .95s ease-out forwards;}
@keyframes flameUp{0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);}100%{opacity:0;transform:translateY(-90px) scale(.15) rotate(20deg);}}
.streak-banner{position:fixed;top:38%;left:50%;transform:translateX(-50%);font-size:clamp(17px,5vw,26px);font-weight:900;white-space:nowrap;pointer-events:none;z-index:300;letter-spacing:2px;animation:bannerAnim 1.1s ease-out forwards;text-shadow:0 0 30px currentColor;}
@keyframes bannerAnim{0%{opacity:0;transform:translateX(-50%) scale(.4);}25%{opacity:1;transform:translateX(-50%) scale(1.2);}65%{opacity:1;transform:translateX(-50%) scale(1);}100%{opacity:0;transform:translateX(-50%) scale(.7);}}
.flash-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:190;animation:flashAnim .4s ease-out forwards;}
@keyframes flashAnim{0%{opacity:.4;}100%{opacity:0;}}
.penalty-txt{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:clamp(20px,5vw,28px);font-weight:900;color:#ff2200;pointer-events:none;z-index:300;text-shadow:0 0 25px #ff0000;animation:penaltyAnim .85s ease-out forwards;}
@keyframes penaltyAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-90px) scale(.6);}}
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}100%{transform:translateX(0)}}
.shake{animation:shake .35s ease-out;}
@keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
.combo-pop{animation:comboPop .22s ease-out;}
.star{position:fixed;border-radius:50%;background:white;pointer-events:none;z-index:1;animation:twinkle var(--d) ease infinite alternate;}
@keyframes twinkle{0%{opacity:.04}100%{opacity:.75}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="infernoCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<!-- START -->
<div class="screen active" id="s-start">
  <div class="game-title">MATH RUSH</div>
  <div class="game-sub">ULTIMATE EDITION</div>
  <div class="menu-card">
    <div class="hi-row"><span>🏆 최고기록</span><span class="hi-val" id="hiShow">0</span></div>
    <button class="mbtn mbtn-easy" onclick="startGame('easy')"><span>⭐ 쉬움</span><span class="mbtn-tag">4지선다 · +/−</span></button>
    <button class="mbtn mbtn-normal" onclick="startGame('normal')"><span>⚡ 보통</span><span class="mbtn-tag">6지선다 · +/−/×</span></button>
    <button class="mbtn mbtn-hard" onclick="startGame('hard')"><span>💀 어려움</span><span class="mbtn-tag">8지선다 · 전연산</span></button>
    <div id="megaWrap"><button class="mbtn mbtn-mega" onclick="startGame('mega')" style="margin-top:2px;"><span>💀💀 MEGA HARD</span><span class="mbtn-tag">해금됨!</span></button></div>
    <div style="font-size:9px;color:rgba(255,255,255,.2);text-align:center;margin-top:4px;">어려움 200점+ 달성 → MEGA HARD 해금</div>
  </div>
</div>

<!-- PLAY -->
<div class="screen" id="s-play">
  <div class="play-inner">
    <div class="hud">
      <div class="hud-box">
        <span style="font-size:11px;opacity:.5;">⏱</span>
        <span class="hud-num" id="timeNum">30</span>
        <span id="penLabel" style="font-size:9px;color:#ff4444;opacity:0;transition:opacity .3s;margin-left:2px;">−3!</span>
      </div>
      <span class="mode-pill" id="modePill">EASY</span>
      <div class="hud-box">
        <span style="font-size:11px;opacity:.5;">🏆</span>
        <span class="hud-num" id="scoreNum">0</span>
      </div>
    </div>
    <div class="time-track"><div class="time-fill" id="timeFill" style="width:100%"></div></div>
    <div class="q-wrap"><span class="q-text" id="qText">?</span></div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="combo-row">
      <div class="combo-left"><span class="combo-lbl">COMBO</span><span class="combo-num" id="comboNum">0</span></div>
      <div class="combo-bar-wrap"><div class="combo-bar-inner" id="comboBarInner" style="width:0%"></div></div>
      <span class="streak-txt" id="streakTxt"></span>
    </div>
    <div class="stats-row">
      <span id="statQ">문제 0개</span>
      <span id="statAcc">정답률 —</span>
      <span id="statHi">최고: 0</span>
    </div>
  </div>
</div>

<!-- END -->
<div class="screen" id="s-end">
  <div class="end-card">
    <div class="end-title">GAME OVER</div>
    <div class="end-mode-badge" id="endBadge"></div>
    <div class="rank-big" id="rankBig">D</div>
    <div class="newhi" id="newHi"></div>
    <div class="end-stats">
      <div class="end-stat"><span class="end-stat-lbl">SCORE</span><span class="end-stat-val" id="eScore">0</span></div>
      <div class="end-stat"><span class="end-stat-lbl">MAX COMBO</span><span class="end-stat-val" id="eCombo">0</span></div>
      <div class="end-stat"><span class="end-stat-lbl">정답</span><span class="end-stat-val" id="eCorrect">0/0</span></div>
      <div class="end-stat"><span class="end-stat-lbl">정답률</span><span class="end-stat-val" id="eAcc">0%</span></div>
    </div>
    <button class="end-btn" onclick="goStart()">🔄 다시하기</button>
  </div>
</div>

<script>
// ── STATE (must be first — canvas loops reference these) ──
let score=0,timeLeft=30,combo=0,maxCombo=0,ans=0,mode='easy',optCount=4;
let ticker=null,correct=0,total=0,hiScore=0,gameActive=false;
const MAX_TIME=30;

// ── STARS ──
for(let i=0;i<70;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.4;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1+Math.random()*3.5}s;`;
  document.body.appendChild(s);
}

// ── BG CANVAS ──
const bgC=document.getElementById('bgCanvas'),bgX=bgC.getContext('2d');
let bgPh=0;
function rsB(){bgC.width=innerWidth;bgC.height=innerHeight;}rsB();addEventListener('resize',rsB);
function bgCols(){
  if(score<50)return['#001400','#002e00','#003d00','#001800'];
  if(score<100)return['#00001e','#00004a','#000f80','#00002e'];
  if(score<200)return['#0c001e','#28004e','#4e0080','#180028'];
  return['#1e0000','#4a0000','#881e00','#2e0000'];
}
function drawBg(){
  const W=bgC.width,H=bgC.height;bgPh+=.005;
  const c=bgCols();
  const g=bgX.createLinearGradient(W/2+Math.sin(bgPh)*W*.45,0,W/2+Math.cos(bgPh*.65)*W*.45,H);
  g.addColorStop(0,c[0]);g.addColorStop(.35,c[1]);g.addColorStop(.7,c[2]);g.addColorStop(1,c[3]);
  bgX.fillStyle=g;bgX.fillRect(0,0,W,H);
  for(let i=0;i<4;i++){
    const ox=W/2+Math.sin(bgPh*1.1+i*2.2)*W*.3,oy=H/2+Math.cos(bgPh*.8+i*1.9)*H*.3;
    const r=70+Math.sin(bgPh+i)*35;
    const og=bgX.createRadialGradient(ox,oy,0,ox,oy,r);
    const a=score>=200?.18:.08;
    og.addColorStop(0,`rgba(255,${score>=200?50:180},0,${a})`);og.addColorStop(1,'rgba(0,0,0,0)');
    bgX.fillStyle=og;bgX.fillRect(0,0,W,H);
  }
  requestAnimationFrame(drawBg);
}
drawBg();

// ── INFERNO ──
const infC=document.getElementById('infernoCanvas'),infX=infC.getContext('2d');
let infPts=[];
function rsI(){infC.width=innerWidth;infC.height=innerHeight;}rsI();addEventListener('resize',rsI);
function drawInferno(){
  infX.clearRect(0,0,infC.width,infC.height);
  if(score>=200&&gameActive){
    const rate=score>=400?.5:score>=300?.38:.25;
    if(Math.random()<rate)infPts.push({x:Math.random()*infC.width,y:infC.height+12,vx:(Math.random()-.5)*2.2,vy:-(1.3+Math.random()*2.8),life:1,dec:.006+Math.random()*.011,sz:4+Math.random()*9,h:Math.random()*38});
    infPts=infPts.filter(p=>p.life>0);
    infPts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;
      const g=infX.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz);
      g.addColorStop(0,`hsla(${p.h},100%,68%,${p.life})`);g.addColorStop(1,`hsla(${p.h+28},100%,48%,0)`);
      infX.fillStyle=g;infX.beginPath();infX.arc(p.x,p.y,p.sz,0,Math.PI*2);infX.fill();
    });
  }
  requestAnimationFrame(drawInferno);
}
drawInferno();

// ── CANVAS FX (trails, rings, explosions) ──
const fxC=document.getElementById('fxCanvas'),fxX=fxC.getContext('2d');
let fxRings=[],fxTrails=[];
function rsF(){fxC.width=innerWidth;fxC.height=innerHeight;}rsF();addEventListener('resize',rsF);
function drawFX(){
  fxX.clearRect(0,0,fxC.width,fxC.height);
  fxRings=fxRings.filter(r=>r.life>0);
  fxRings.forEach(r=>{
    r.radius+=r.speed;r.life-=.04;
    fxX.strokeStyle=`rgba(${r.col},${r.life})`;
    fxX.lineWidth=2*r.life;
    fxX.beginPath();fxX.arc(r.x,r.y,r.radius,0,Math.PI*2);fxX.stroke();
  });
  requestAnimationFrame(drawFX);
}
drawFX();

function addRings(x,y,col,n){
  for(let i=0;i<n;i++){
    setTimeout(()=>{fxRings.push({x,y,radius:10+i*8,speed:3+i*1.5,life:1,col});},i*60);
  }
}

// ── STORAGE ──
function loadHi(){try{hiScore=parseInt(localStorage.getItem('mathRushHi')||'0');}catch(e){hiScore=0;}}
function saveHi(){try{if(score>hiScore){localStorage.setItem('mathRushHi',String(score));hiScore=score;}}catch(e){}}

// ── MEGA: only show if unlocked ──
function checkMega(){
  try{
    const unlocked=localStorage.getItem('mega')==='true';
    document.getElementById('megaWrap').style.display=unlocked?'block':'none';
  }catch(e){
    document.getElementById('megaWrap').style.display='none';
  }
}

loadHi();
document.getElementById('hiShow').innerText=hiScore;
// Always hide mega on load, only show if localStorage says so
document.getElementById('megaWrap').style.display='none';
checkMega();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── START ──
function startGame(m){
  mode=m;score=0;timeLeft=MAX_TIME;combo=0;maxCombo=0;correct=0;total=0;gameActive=true;
  optCount=m==='easy'?4:m==='normal'?6:8;
  document.getElementById('modePill').innerText={easy:'EASY',normal:'NORMAL',hard:'HARD',mega:'MEGA'}[m];
  document.getElementById('timeNum').style.color='white';
  document.getElementById('timeNum').style.textShadow='none';
  document.getElementById('choicesGrid').style.gridTemplateColumns=optCount===4?'1fr 1fr':optCount===6?'1fr 1fr 1fr':'1fr 1fr 1fr 1fr';
  updateHUD();updateTimeFill();updateComboUI();
  document.getElementById('statHi').innerText='최고: '+hiScore;
  showScreen('s-play');
  nextQ();
  clearInterval(ticker);
  ticker=setInterval(tick,1000);
}

function tick(){
  if(!gameActive)return;
  timeLeft--;
  document.getElementById('timeNum').innerText=timeLeft;
  updateTimeFill();
  if(timeLeft<=8){document.getElementById('timeNum').style.color='#ff3300';document.getElementById('timeNum').style.textShadow='0 0 12px #ff0000';}
  if(timeLeft<=0)endGame();
}

function updateTimeFill(){
  const pct=Math.max(0,timeLeft/MAX_TIME*100);
  const f=document.getElementById('timeFill');
  f.style.width=pct+'%';
  f.style.background=pct>55?'linear-gradient(90deg,#00cc55,#00ffaa)':pct>25?'linear-gradient(90deg,#ccaa00,#ffee00)':'linear-gradient(90deg,#cc2200,#ff4400)';
}

function updateHUD(){
  document.getElementById('scoreNum').innerText=score;
  document.getElementById('statHi').innerText='최고: '+Math.max(score,hiScore);
}

// ── QUESTION ──
function nextQ(){
  if(!gameActive)return;
  let a=Math.floor(Math.random()*20),b=Math.floor(Math.random()*20);
  const ops=mode==='easy'?['+','-']:mode==='mega'?['+','-','×','÷']:['+','-','×'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  if(op==='÷'){b=b||1;a=a*b;}
  ans=op==='+'?a+b:op==='-'?a-b:op==='×'?a*b:a/b;
  const qt=document.getElementById('qText');
  qt.innerText=`${a} ${op} ${b}`;
  qt.style.textShadow=combo>=10?'0 0 30px #ff6600,0 0 55px #ff0000,0 0 8px #ffcc00':combo>=5?'0 0 22px #ffaa00,0 0 44px #ff6600':'0 0 22px cyan,0 0 44px #0088ff';
  let arr=[ans];
  while(arr.length<optCount){const w=ans+(Math.floor(Math.random()*11)-5);if(w!==ans&&!arr.includes(w))arr.push(w);}
  arr.sort(()=>Math.random()-.5);
  const grid=document.getElementById('choicesGrid');grid.innerHTML='';
  arr.forEach(v=>{
    const b=document.createElement('button');b.className='choice-btn';b.innerText=v;
    b.onclick=()=>pick(b,v);grid.appendChild(b);
  });
}

// ── STREAK ──
const STREAK={3:'🔥 ON FIRE!',5:'⚡ ELECTRIC!',7:'💥 UNSTOPPABLE!',10:'🌋 INFERNO!!',15:'👾 GODLIKE!',20:'🌌 BEYOND!'};

// ── PICK ──
function pick(btn,v){
  if(!gameActive)return;
  total++;
  const rect=btn.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;

  if(v===ans){
    correct++;combo++;if(combo>maxCombo)maxCombo=combo;
    const bonus=mode==='mega'?5:mode==='hard'?2:0;
    const pts=10+combo*2+bonus;
    score+=pts;
    btn.classList.add('correct');
    // MAXIMUM PARTICLES ON CORRECT
    burstParticles(cx,cy,'correct');
    addRings(cx,cy,'0,255,136',combo>=10?6:4);
    spawnDOM_Float(cx,cy-25,'+'+pts,'#00ffcc',combo>=10?22:16);
    spawnDOM_Sparks(cx,cy,combo>=10?40:20,'correct');
    spawnDOM_Shockwave(cx,cy);
    if(combo>=5)spawnDOM_Shockwave(cx,cy,80);
    if(STREAK[combo])spawnDOM_Banner(STREAK[combo]);
    if(combo>0&&combo%5===0)massFlames();
    if(combo>=10)rainbowBurst(cx,cy);
  } else {
    combo=0;
    timeLeft=Math.max(1,timeLeft-3);
    document.getElementById('timeNum').innerText=timeLeft;
    updateTimeFill();
    btn.classList.add('wrong');
    burstParticles(cx,cy,'wrong');
    addRings(cx,cy,'255,0,68',3);
    spawnDOM_Sparks(cx,cy,15,'wrong');
    spawnDOM_Flash();
    spawnDOM_PenaltyTxt();
    const qt=document.getElementById('qText');qt.classList.remove('shake');void qt.offsetWidth;qt.classList.add('shake');
    const pl=document.getElementById('penLabel');pl.style.opacity=1;setTimeout(()=>pl.style.opacity=0,950);
  }
  updateHUD();updateComboUI();
  document.getElementById('statQ').innerText='문제 '+total+'개';
  document.getElementById('statAcc').innerText='정답률 '+Math.round(correct/total*100)+'%';
  setTimeout(nextQ,280);
}

// ── CANVAS PARTICLE BURST ──
function burstParticles(cx,cy,type){
  const correct=type==='correct';
  const n=correct?80:40;
  const colors=correct
    ?['#00ff88','#00ffcc','#aaffee','#ffff00','#ffffff','#00ff44']
    :['#ff0044','#ff4400','#ff8800','#ffffff','#ffcc00'];
  for(let i=0;i<n;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=(correct?3:2)+Math.random()*(correct?8:5);
    const sz=(correct?3:2)+Math.random()*5;
    const color=colors[Math.floor(Math.random()*colors.length)];
    const p=document.createElement('div');
    p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;border-radius:50%;background:${color};pointer-events:none;z-index:150;`;
    document.body.appendChild(p);
    const tx=Math.cos(angle)*speed*15,ty=Math.sin(angle)*speed*15;
    p.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${tx}px,${ty}px) scale(0)`,opacity:0}
    ],{duration:500+Math.random()*400,easing:'ease-out',fill:'forwards'}).onfinish=()=>p.remove();
  }
  // extra streaks
  if(correct){
    const streakN=combo>=10?20:12;
    for(let i=0;i<streakN;i++){
      const angle=Math.random()*Math.PI*2;
      const len=30+Math.random()*60;
      const p=document.createElement('div');
      p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:${2+Math.random()*2}px;height:${len}px;background:linear-gradient(to bottom,rgba(0,255,136,0.9),rgba(0,255,136,0));pointer-events:none;z-index:148;transform-origin:top center;transform:rotate(${angle}rad);border-radius:2px;`;
      document.body.appendChild(p);
      p.animate([{opacity:1,transform:`rotate(${angle}rad) scaleY(1)`},{opacity:0,transform:`rotate(${angle}rad) scaleY(0) translateY(-60px)`}],{duration:400+Math.random()*200,easing:'ease-out',fill:'forwards'}).onfinish=()=>p.remove();
    }
  }
}

function rainbowBurst(cx,cy){
  const cols=['#ff0000','#ff8800','#ffff00','#00ff00','#00ffff','#0088ff','#ff00ff','#ff0088'];
  cols.forEach((c,i)=>{
    setTimeout(()=>{
      for(let j=0;j<6;j++){
        const p=document.createElement('div');
        const a=((i/cols.length)*Math.PI*2)+(j*.1);
        const d=60+j*15;
        const sz=5+Math.random()*5;
        p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;border-radius:50%;background:${c};pointer-events:none;z-index:155;box-shadow:0 0 6px ${c};`;
        document.body.appendChild(p);
        p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:600,easing:'ease-out',fill:'forwards'}).onfinish=()=>p.remove();
      }
    },i*30);
  });
}

// ── DOM FX ──
function spawnDOM_Float(x,y,txt,col,sz){
  const el=document.createElement('div');el.className='float-txt';
  el.innerText=txt;el.style.cssText=`left:${x}px;top:${y}px;color:${col};font-size:${sz}px;text-shadow:0 0 12px ${col};`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1050);
}

function spawnDOM_Sparks(cx,cy,n,type){
  const cols=type==='correct'?['#00ff88','#ffff00','#00ffcc','#ffffff']:['#ff0044','#ff8800','#ffff00'];
  const glyphs=['★','✦','◆','▲','●'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;font-size:${8+Math.random()*10}px;color:${cols[Math.floor(Math.random()*cols.length)]};pointer-events:none;z-index:160;`;
    el.innerText=glyphs[Math.floor(Math.random()*glyphs.length)];
    document.body.appendChild(el);
    const angle=Math.random()*Math.PI*2,d=40+Math.random()*80;
    el.animate([{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},{transform:`translate(${Math.cos(angle)*d}px,${Math.sin(angle)*d}px) scale(0) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:600+Math.random()*400,easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove();
  }
}

function spawnDOM_Shockwave(cx,cy,extra=0){
  const s=document.createElement('div');
  const base=10+extra;
  s.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;border-radius:50%;pointer-events:none;z-index:170;border:2px solid rgba(255,255,255,.8);width:${base}px;height:${base}px;margin-left:-${base/2}px;margin-top:-${base/2}px;`;
  document.body.appendChild(s);
  s.animate([{width:base+'px',height:base+'px',marginLeft:-base/2+'px',marginTop:-base/2+'px',opacity:.9,borderWidth:'3px'},{width:'150px',height:'150px',marginLeft:'-75px',marginTop:'-75px',opacity:0,borderWidth:'1px'}],{duration:550,easing:'ease-out',fill:'forwards'}).onfinish=()=>s.remove();
}

function spawnDOM_Banner(msg){
  const el=document.createElement('div');el.className='streak-banner';
  el.innerText=msg;el.style.color=getCC(combo);
  document.body.appendChild(el);setTimeout(()=>el.remove(),1150);
}

function spawnDOM_Flash(){
  const f=document.createElement('div');f.className='flash-overlay';
  f.style.background='rgba(255,0,0,1)';document.body.appendChild(f);setTimeout(()=>f.remove(),450);
}

function spawnDOM_PenaltyTxt(){
  const p=document.createElement('div');p.className='penalty-txt';p.innerText='⚠ −3초!';
  document.body.appendChild(p);setTimeout(()=>p.remove(),950);
}

function massFlames(){
  const gl=['🔥','💥','⚡','🌋','✨','💫','🎆'];
  const n=16+Math.floor(combo/3);
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const f=document.createElement('span');f.className='flame-el';
      f.innerText=gl[Math.floor(Math.random()*gl.length)];
      f.style.fontSize=(12+Math.random()*22)+'px';
      f.style.left=Math.random()*innerWidth+'px';
      f.style.top=(innerHeight*.15+Math.random()*innerHeight*.65)+'px';
      document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
    },i*45);
  }
}

function doComboFlames(){
  if(combo<10)return;
  const gl=['🔥','⚡','💥'];
  const n=Math.min(2+Math.floor(combo/4),7);
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const f=document.createElement('span');f.className='flame-el';
      f.innerText=gl[Math.floor(Math.random()*gl.length)];
      f.style.fontSize='20px';
      f.style.left=Math.random()*innerWidth+'px';
      f.style.top=(innerHeight*.3+Math.random()*innerHeight*.4)+'px';
      document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
    },i*80);
  }
}

// ── COMBO UI ──
function getCC(c){
  if(c<=0)return'#777';if(c<3)return'#fff';if(c<5)return'#aaffee';
  if(c<7)return'#00ffcc';if(c<10)return'#aaff00';if(c<15)return'#ffee00';
  if(c<20)return'#ff9900';return'#ff00ff';
}
function updateComboUI(){
  const cn=document.getElementById('comboNum'),col=getCC(combo);
  cn.innerText=combo;cn.style.color=col;
  cn.style.textShadow=combo>=10?`0 0 18px ${col},0 0 36px ${col}`:`0 0 8px ${col}`;
  cn.style.fontSize=combo>=8?`${26+combo*1.3}px`:'26px';
  cn.classList.remove('combo-pop');void cn.offsetWidth;cn.classList.add('combo-pop');
  document.getElementById('comboBarInner').style.width=Math.min(combo/20*100,100)+'%';
  document.getElementById('comboBarInner').style.background=col;
  const keys=Object.keys(STREAK).map(Number).filter(k=>k<=combo);
  const st=document.getElementById('streakTxt');
  if(keys.length){st.innerText=STREAK[keys[keys.length-1]];st.style.color=col;}else st.innerText='';
  doComboFlames();
}

// ── END ──
function endGame(){
  gameActive=false;clearInterval(ticker);saveHi();loadHi();
  document.getElementById('eScore').innerText=score;
  document.getElementById('eCombo').innerText=maxCombo+'x';
  document.getElementById('eCorrect').innerText=correct+'/'+total;
  document.getElementById('eAcc').innerText=Math.round((total?correct/total:0)*100)+'%';
  const rs=[[600,'🌌','#ff00ff'],[500,'SS','#ff55ff'],[400,'S','#ffee00'],[300,'A','#00ff88'],[200,'B','#00ccff'],[100,'C','#aaaaff'],[0,'D','#888']];
  const [,r,c]=rs.find(([t])=>score>t)||rs[rs.length-1];
  const rb=document.getElementById('rankBig');rb.innerText=r;rb.style.color=c;
  const bmap={easy:'⭐ EASY',normal:'⚡ NORMAL',hard:'💀 HARD',mega:'💀💀 MEGA'};
  const bcol={easy:'#003322',normal:'#332200',hard:'#330011',mega:'#1a0044'};
  const eb=document.getElementById('endBadge');
  eb.innerText=bmap[mode];eb.style.background=bcol[mode];eb.style.color='white';eb.style.padding='3px 12px';eb.style.borderRadius='20px';
  document.getElementById('newHi').innerText=score>=hiScore&&score>0?'🎉 NEW HI-SCORE!':'';
  try{if(mode==='hard'&&score>=200)localStorage.setItem('mega','true');}catch(e){}
  checkMega();
  showScreen('s-end');
  massFlames();
  // big end burst
  setTimeout(()=>{
    const cx=innerWidth/2,cy=innerHeight/2;
    rainbowBurst(cx,cy);burstParticles(cx,cy,'correct');
    addRings(cx,cy,'255,200,0',8);
  },200);
}

function goStart(){
  gameActive=false;clearInterval(ticker);
  document.getElementById('hiShow').innerText=hiScore;
  showScreen('s-start');
  checkMega();
}
</script>
